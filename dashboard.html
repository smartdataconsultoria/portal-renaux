<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Renaux Service | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-text">RENAUX <span>SERVICE</span></div>
      <div class="logo-subtitle">Portal de Dashboards</div>
    </div>

    <div class="nav-section">
      <div class="nav-title">CATEGORIAS</div>
      <div id="categories-list"></div>
    </div>
    <div class="nav-section">
  <div class="nav-title">BASE DE DADOS</div>
  <div id="database-list"></div>
</div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-email" id="user-email"></div>
      </div>
      <button class="btn-sair" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="header-title">
        <h1>Dashboards</h1>
        <span class="badge-powerbi">POWER BI</span>
      </div>
      <div class="header-date" id="current-date"></div>
    </div>

    <div class="content">
      <div class="greeting">
        <div class="greeting-title">Bem-vindo! 👋</div>
        <div class="greeting-subtitle" id="greeting-subtitle">Carregando...</div>
      </div>

      <div id="dashboard-grid"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>

</body>
</html>
