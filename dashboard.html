<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Renaux Service | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1220;
  --navy-mid: #1a2332;
  --navy-dark: #0f1820;
  --gold: #c8922a;
  --gold-light: #e8a93a;
  --text: #e8edf5;
  --text-muted: #8899bb;
  --border: #2a3d52;
}

* {margin:0;padding:0;box-sizing:border-box}
body {
  font-family: 'Poppins', sans-serif;
  background: var(--navy);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: var(--navy-mid);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 30px 20px;
  overflow-y: auto;
}

.sidebar-header {
  margin-bottom: 40px;
}

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  color: var(--text);
  margin-bottom: 4px;
}

.logo-text span {
  color: var(--gold);
}

.logo-subtitle {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.nav-section {
  margin-bottom: 30px;
}

.nav-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
  padding-left: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  color: var(--text-muted);
  text-decoration: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
  margin-bottom: 4px;
}

.nav-item:hover {
  background: rgba(200,146,42,.1);
  color: var(--gold);
}

.nav-item.active {
  background: rgba(200,146,42,.15);
  color: var(--gold);
  font-weight: 600;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.user-info {
  padding: 12px;
  border-radius: 6px;
  background: rgba(200,146,42,.08);
  margin-bottom: 12px;
}

.user-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

.user-email {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

.btn-sair {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: 'Poppins', sans-serif;
}

.btn-sair:hover {
  background: var(--gold);
  color: var(--navy);
}

/* MAIN CONTENT */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--navy-dark);
  overflow: hidden;
}

.header {
  height: 80px;
  background: var(--navy-mid);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--text);
}

.badge-powerbi {
  background: var(--gold);
  color: var(--navy);
  font-size: 9px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.header-date {
  font-size: 12px;
  color: var(--text-muted);
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 40px;
}

.greeting {
  margin-bottom: 30px;
}

.greeting-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.greeting-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 20px;
  margin-top: 30px;
}

.section-title:first-of-type {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
  margin-bottom: 30px;
}

.card {
  background: var(--navy-mid);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: all .3s;
  cursor: pointer;
}

.card:hover {
  border-color: var(--gold);
  box-shadow: 0 8px 24px rgba(200,146,42,.15);
  transform: translateY(-2px);
}

.card-icon {
  width: 64px;
  height: 64px;
  background: var(--gold);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.card-category {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}

.card-description {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 20px;
  line-height: 1.4;
}

.card-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  text-decoration: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: 'Poppins', sans-serif;
}

.card-link:hover {
  background: var(--gold);
  color: var(--navy);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.loading {
  text-align: center;
  padding: 60px 20px;
}

.spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(200,146,42,.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--navy);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}
</style>
</head>
<body>

<div class="container">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo-text">RENAUX <span>SERVICE</span></div>
      <div class="logo-subtitle">Portal de Dashboards</div>
    </div>

    <div class="nav-section">
      <div class="nav-title">NAVEGAÇÃO</div>
      <a class="nav-item active" onclick="return false">📊 Dashboards</a>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-email" id="user-email"></div>
      </div>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="header">
      <div class="header-title">
        <h1>Dashboards</h1>
        <span class="badge-powerbi">POWER BI</span>
      </div>
      <div class="header-date" id="current-date"></div>
    </div>

    <div class="content">
      <div class="greeting">
        <div class="greeting-title">Bem-vindo! 👋</div>
        <div class="greeting-subtitle">Selecione um dashboard abaixo para visualizar em tela cheia</div>
      </div>

      <div id="dashboard-grid"></div>
    </div>
  </div>
</div>

<!-- SCRIPT -->
<script>
console.log('🟡 [INIT] Script iniciado');

// ========== VARIÁVEIS GLOBAIS ==========
var SB_URL = 'https://rbahvyejqybajnufftio.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYWh2eWVqcXliYWpudWZmdGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjA5MjIsImV4cCI6MjA4OTYzNjkyMn0.nUIo2CT3o41YL1TT8Hrp5kq-_ZS-bMMf-gvUMCEyYMw';
var sb = null;
var usr = {};
var todosDashboards = [];

console.log('✓ Variáveis definidas');

// ========== FUNÇÕES ==========

function iniciarApp() {
  console.log('✅ [SUPABASE LOADED] Supabase carregado');
  
  if(typeof supabase === 'undefined') {
    console.error('❌ Supabase indefinido');
    setTimeout(iniciarApp, 100);
    return;
  }
  
  try {
    console.log('🔧 Criando cliente...');
    sb = supabase.createClient(SB_URL, SB_KEY);
    console.log('✓ Cliente criado');
    carregarAplicacao();
  } catch(e) {
    console.error('❌ Erro:', e.message);
  }
}

async function carregarAplicacao() {
  try {
    console.log('🔐 Verificando sessão...');
    
    var {data:{session}} = await sb.auth.getSession();
    
    if(!session) {
      console.log('❌ Sem sessão');
      setTimeout(() => window.location.href = './login.html', 1000);
      return;
    }
    
    console.log('✅ Autenticado:', session.user.email);
    usr = {email: session.user.email, token: session.access_token};
    
    document.getElementById('user-name').textContent = session.user.email.split('@')[0];
    document.getElementById('user-email').textContent = session.user.email;
    
    // Atualizar data
    var now = new Date();
    var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    var dateStr = now.toLocaleDateString('pt-BR', options);
    document.getElementById('current-date').textContent = dateStr;
    
    console.log('📊 Carregando dashboards...');
    var headers = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + usr.token};
    var resp = await fetch(SB_URL + '/rest/v1/dashboards_clientes?select=*', {headers: headers});
    
    if(resp.ok) {
      todosDashboards = await resp.json();
      console.log('✓ Carregados:', todosDashboards.length);
    }
    
    renderizar();
    console.log('✅✅✅ APP PRONTO! ✅✅✅');
    
  } catch(e) {
    console.error('❌ ERRO:', e);
    setTimeout(() => window.location.href = './login.html', 2000);
  }
}

function renderizar() {
  var grid = document.getElementById('dashboard-grid');
  
  if(!todosDashboards.length) {
    grid.innerHTML = '<div class="empty-state">Nenhum dashboard disponível</div>';
    return;
  }
  
  // Agrupar por categoria
  var porCategoria = {};
  todosDashboards.forEach(d => {
    var cat = d.categoria || 'Sem Categoria';
    if(!porCategoria[cat]) porCategoria[cat] = [];
    porCategoria[cat].push(d);
  });
  
  var html = '';
  
  Object.keys(porCategoria).forEach(categoria => {
    html += '<div class="section-title">' + esc(categoria) + '</div>';
    html += '<div class="grid">';
    
    porCategoria[categoria].forEach((d, idx) => {
      var icons = ['📊', '📈', '📉', '💼', '🎯', '🔍'];
      var icon = icons[idx % icons.length];
      
      html += '<div class="card">' +
        '<div class="card-icon">' + icon + '</div>' +
        '<div class="card-title">' + esc(d.titulo) + '</div>' +
        '<div class="card-category">' + esc(categoria) + '</div>' +
        '<div class="card-description">' + esc(d.descricao || 'Dashboard de análise de dados') + '</div>' +
        '<a href="' + esc(d.url) + '" target="_blank" class="card-link">🔗 Abrir no Power BI</a>' +
        '</div>';
    });
    
    html += '</div>';
  });
  
  grid.innerHTML = html;
}

function esc(s) {
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function sair() {
  if(sb) await sb.auth.signOut();
  window.location.href = './login.html';
}

console.log('✓ Funções definidas');
</script>

<!-- SUPABASE - CARREGAR AGORA -->
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="iniciarApp()"></script>

</body>
</html>
