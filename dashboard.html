<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Renaux Service | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1220;
  --navy-mid: #0f1a2e;
  --navy-card: #13213a;
  --navy-border: #1e3050;
  --gold: #c8922a;
  --gold-light: #e8a93a;
  --gold-glow: rgba(200,146,42,.15);
  --text: #e8edf5;
  --text-muted: #5a7299;
  --green: #34c97e;
  --danger: #e05555;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Poppins',sans-serif;background:var(--navy);color:var(--text)}
#tela-loading{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--text)}
.loading-logo span{color:var(--gold)}
.spinner{width:36px;height:36px;border:2px solid rgba(200,146,42,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#tela-app{display:none;height:100vh;flex-direction:column}
.topbar{height:60px;background:var(--navy-mid);border-bottom:1px solid var(--navy-border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50}
.t-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.t-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold-light),var(--gold));border-radius:8px;display:flex;align-items:center;justify-content:center}
.t-logo-nome{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text)}
.t-logo-nome span{color:var(--gold)}
.t-right{display:flex;align-items:center;gap:10px}
.t-badge{background:var(--gold-glow);border:1px solid rgba(200,146,42,.3);border-radius:7px;padding:4px 13px;font-size:11px;font-weight:600;color:var(--gold)}
.t-email{font-size:11px;color:var(--text-muted)}
.t-btn{background:transparent;border:1px solid var(--navy-border);border-radius:7px;color:var(--text-muted);padding:6px 13px;font-size:11px;cursor:pointer;font-family:'Poppins',sans-serif}
.t-btn:hover{border-color:var(--danger);color:var(--danger)}
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--navy-mid);border-right:1px solid var(--navy-border);overflow-y:auto;flex-shrink:0}
.sidebar-section{padding:20px 0;border-bottom:1px solid var(--navy-border)}
.sidebar-header{padding:0 20px;font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:10px}
.sidebar-item{padding:8px 20px;font-size:13px;color:var(--text-muted);cursor:pointer;text-decoration:none;display:flex;align-items:center}
.sidebar-item:hover{color:var(--gold);background:var(--gold-glow)}
.sidebar-item.ativo{color:var(--gold);background:var(--gold-glow);font-weight:600}
#main-content{flex:1;overflow-y:auto;padding:24px;display:none}
#main-content.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--navy-card);border:1px solid var(--navy-border);border-radius:10px;overflow:hidden;transition:all .3s}
.card:hover{border-color:var(--gold);box-shadow:0 8px 16px rgba(200,146,42,.1)}
.card-header{padding:16px}
.card-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.card-subtitle{font-size:11px;color:var(--text-muted)}
.dashboard-container{position:relative;width:100%;height:600px;border-radius:8px;overflow:hidden;background:var(--navy-card);border:1px solid var(--navy-border)}
.dashboard-container iframe{width:100%;height:100%;border:none}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy-card);border:1px solid var(--navy-border);color:var(--text);padding:14px 18px;border-radius:8px;font-size:12px;animation:slideIn .3s ease;z-index:2000}
.toast.ok{border-left:4px solid var(--green)}
.toast.err{border-left:4px solid var(--danger)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{padding:40px;text-align:center;color:var(--text-muted)}
</style>
</head>
<body>

<div id="tela-loading">
  <div class="loading-logo">RENAUX <span>SERVICE</span></div>
  <div class="spinner"></div>
  <div id="loading-status" style="font-size:12px;color:var(--text-muted);margin-top:20px">Carregando...</div>
</div>

<div id="tela-app">
  <div class="topbar">
    <a href="#" class="t-logo">
      <div class="t-logo-icon">📊</div>
      <span class="t-logo-nome">RENAUX <span>SERVICE</span></span>
    </a>
    <div class="t-right">
      <span class="t-badge" id="status-badge">🟢 OK</span>
      <span class="t-email" id="user-email"></span>
      <button class="t-btn" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-section">
        <a href="#" class="sidebar-item ativo" onclick="return false">🏠 Início</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-header">DASHBOARDS</div>
        <div id="sidebar-dashboards"></div>
      </div>
    </div>

    <div id="main-content" class="show">
      <h2 style="margin-bottom:20px">Bem-vindo! 👋</h2>
      <div class="grid" id="dashboard-grid"></div>
    </div>
  </div>
</div>

<!-- SUPABASE - CARREGAR NO FINAL -->
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="iniciarApp()"></script>

<script>
console.log('🟡 [INIT] Script iniciado');

// ========== VARIÁVEIS GLOBAIS (SUPABASE ANTIGO) ==========
var SB_URL = 'https://rbahvyejqybajnufftio.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYWh2eWVqcXliYWpudWZmdGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjA5MjIsImV4cCI6MjA4OTYzNjkyMn0.nUIo2CT3o41YL1TT8Hrp5kq-_ZS-bMMf-gvUMCEyYMw';
var sb = null;
var usr = {};
var todosDashboards = [];

console.log('✓ Variáveis globais definidas');

function iniciarApp() {
  console.log('✅ [SUPABASE LOADED] Supabase carregado');
  
  if(typeof supabase === 'undefined') {
    console.error('❌ Supabase indefinido');
    setTimeout(iniciarApp, 100);
    return;
  }
  
  try {
    console.log('🔧 Criando cliente...');
    sb = supabase.createClient(SB_URL, SB_KEY);
    console.log('✓ Cliente criado');
    carregarAplicacao();
  } catch(e) {
    console.error('❌ Erro:', e.message);
    updateStatus('❌ ' + e.message, 'error');
  }
}

async function carregarAplicacao() {
  try {
    console.log('🔐 Verificando sessão...');
    updateStatus('🔐 Verificando...');
    
    var {data:{session}} = await sb.auth.getSession();
    
    if(!session) {
      console.log('❌ Sem sessão');
      updateStatus('❌ Não autenticado', 'error');
      setTimeout(() => window.location.href = './login.html', 1500);
      return;
    }
    
    console.log('✅ Autenticado:', session.user.email);
    usr = {email: session.user.email, token: session.access_token};
    updateStatus('✅ ' + usr.email, 'success');
    
    document.getElementById('user-email').textContent = usr.email;
    
    console.log('📊 Carregando dashboards...');
    var headers = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + usr.token};
    var resp = await fetch(SB_URL + '/rest/v1/dashboards_clientes?select=*', {headers: headers});
    
    if(resp.ok) {
      todosDashboards = await resp.json();
      console.log('✓ Carregados:', todosDashboards.length);
    }
    
    renderizar();
    console.log('✅✅✅ APP PRONTO! ✅✅✅');
    
    setTimeout(() => {
      document.getElementById('tela-loading').style.display = 'none';
      document.getElementById('tela-app').style.display = 'flex';
    }, 500);
    
  } catch(e) {
    console.error('❌ ERRO:', e);
    updateStatus('❌ Erro', 'error');
    setTimeout(() => window.location.href = './login.html', 2000);
  }
}

function updateStatus(msg, tipo) {
  var el = document.getElementById('loading-status');
  if(el) {
    var cor = tipo === 'error' ? '#e05555' : (tipo === 'success' ? '#34c97e' : '#5a7299');
    el.innerHTML = '<p style="color:' + cor + '">' + msg + '</p>';
  }
}

function renderizar() {
  var grid = document.getElementById('dashboard-grid');
  var sidebar = document.getElementById('sidebar-dashboards');
  
  if(!todosDashboards.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Nenhum dashboard</div>';
    sidebar.innerHTML = '<p style="font-size:11px;color:var(--text-muted);padding:0 20px">Nenhum</p>';
    return;
  }
  
  grid.innerHTML = todosDashboards.map(d => 
    '<div class="card"><div class="card-header"><div class="card-title">' + esc(d.titulo) + '</div><div class="card-subtitle">' + esc(d.categoria || 'Dashboard') + '</div></div><div style="padding:0 16px 16px"><div class="dashboard-container"><iframe src="' + esc(d.url) + '?nocache=' + Date.now() + '" allow="fullscreen"></iframe></div></div></div>'
  ).join('');
  
  sidebar.innerHTML = todosDashboards.map(d =>
    '<a href="#" class="sidebar-item" onclick="return false">📊 ' + esc(d.titulo.substring(0,18)) + '</a>'
  ).join('');
}

function esc(s) {
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function sair() {
  if(sb) sb.auth.signOut();
  window.location.href = './login.html';
}

console.log('✓ Script pronto');
</script>

</body>
</html>
